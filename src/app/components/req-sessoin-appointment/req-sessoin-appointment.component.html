<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="row m-5"></div>
    <div class="row m-5">
        <div class="col-2"></div>
        <div class="col-8" id="session-req-form">
            <div class="row m-3"></div>
            <h1 class="text-center" id="form-h1">Welcome to kavishka Jay Photography</h1>
            <p class="text-center" id="form-p"> Let's make a session appointment </p>
            <form [formGroup]="sessionForm">
                <div class="form-group">
                    <!--
                    <label for="FullName">Full Name :</label>
                    <input type="text" class="form-control" id="FullName" name="FullName" placeholder="Full Name" required>
                    <label for="EmailAddress">Email Address :</label>
                    <input type="email" class="form-control" id="EmailAddress" name="EmailAddress" placeholder="Email Address" required>
                    <label for="Phonenumber">Phone number :</label>                    
                    <input type="tel" class="form-control" id="Phonenumber" name="Phonenumber" placeholder="Phone number" required>
                    -->
                    <label for="Package">Package :</label>
                    <select class="form-select" id="package" formControlName="photographyPackage">
                        <option value="">Choose package</option>
                        @for(package of packages; track package.packageId){
                        <option [ngValue]="package">{{package.name + " - " + (package.price | currency :
                            'LKR')}}</option>
                        }
                    </select>

                    <label for="add-item">Additional Items :</label>
                    <div formArrayName="additionalItems">
                        <div id="items-container">

                            <div *ngFor="let item of items.controls; let i = index" [formGroupName]="i" class="row m-2">
                                <div class="col-6">
                                    <select class="form-control" id="availableItemInput " formControlName="item">
                                        <option value="" disabled selected> Select an item </option>
                                        <option *ngFor="let availableItem of availableItems" [ngValue]="availableItem">
                                            {{ availableItem.name + " - " + (availableItem.price | currency : 'LKR')
                                            }} </option>
                                    </select>
                                </div>


                                <div class="col-6">
                                    <input class="form-control" type="number" id="itemQuantityInput "
                                        formControlName="quantity" min="0" placeholder="Enter quantity">
                                </div>


                                <div class="mb-3"></div>
                                <button type="button" class="btn btn-success btn-sm" id="btn-plus"
                                    (click)="addItem()">+</button>
                            </div>

                        </div>
                        <div class="row m-4"></div>
                    </div>

                    <label for="note">Total Price (LKR)</label>
                    <input type="text" class="form-control" id="amount" name="amount" placeholder="Total Price" formControlName="amount">

                    <label for="date-time">Date & Time :</label>
                    <div class="row">
                        <div class="col-6">
                            <input type="date" class="form-control" id="date" name="date" placeholder="date" formControlName="date" required >
                        </div>
                        <div class="col-6">
                            <input type="time" class="form-control" id="time" name="time" placeholder="time" formControlName="time" required>
                        </div>
                    </div>
                    <label for="Location">Location :</label>
                    <input type="text" class="form-control" id="Location" name="Location" placeholder="Location" formControlName="place"  required>
                    <label for="note"> Event :</label>
                    <input type="text" class="form-control" id="note" name="note" placeholder="Event" formControlName="event">
                </div>
            </form>
            <button type="submit" class="btn btn-primary" id="btn-req-session" (click)="onSubmit()">Request
                Appointment</button>
            <div class="row m-3"></div>
        </div>
        <div class="col-2"></div>
        <div class="row m-5"></div>
    </div>
</body>

</html>
