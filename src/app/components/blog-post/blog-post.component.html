        <div class="col-10">
            <img src="/blog-img.avif" alt="avater-band" class="img-fluid" id="blog-img">

                    {{blog.description}}                   
                </div>
                <div class="row m-1 ">
                    <div class="row mt-3 justify-content-center text-center" id="blog-publishedDate"> <b> {{blog.publishedDate | date: 'yyyy-MM-dd'}} </b> </div>
                </div>
            </div>
        </div>
        <div class="col-1"></div>
    
    </div>
